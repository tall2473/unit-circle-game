<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#07101f"><title>単位円ポジション・トレーナー</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101f;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;overflow:hidden}.app{height:100vh;padding:12px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.title b{font-size:22px}.title small{display:block;color:#91a0b8}.tabs{display:flex;gap:6px;background:#101827;padding:5px;border-radius:14px}.tabs button,.big{border:0;border-radius:10px;font-weight:900;cursor:pointer;touch-action:manipulation}.tabs button{padding:10px 14px;background:transparent;color:#cbd5e1}.tabs button.on,.big{background:#22d3ee;color:#06202a}.panel{margin-top:10px;flex:1;min-height:0;border:1px solid #334155;border-radius:24px;background:#0f172acc;padding:12px;display:flex;flex-direction:column}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}.stat{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:7px;text-align:center}.stat small{color:#94a3b8;margin-right:7px}.stat b{font-size:19px}.game{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0;align-items:center}.side{height:100%;display:flex;flex-direction:column;justify-content:center;min-height:0}.kind{font-weight:900;color:#67e8f9;font-size:18px}.ask{font-size:24px;font-weight:800;color:#cbd5e1;margin-top:10px}.angle{font-weight:1000;font-size:clamp(64px,8vw,100px);margin:4px 0}.circleWrap{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}.circle{width:min(100%,72vh);max-width:510px;aspect-ratio:1}.feedback{min-height:82px;padding:12px 16px;border-radius:15px}.feedback.ok{border:1px solid #4ade80;background:#22c55e18}.feedback.ng{border:1px solid #f87171;background:#ef444418}.feedback strong{font-size:21px}.feedback.ok strong{color:#86efac}.feedback.ng strong{color:#fca5a5}.hint{margin-top:4px;color:#e2e8f0;font-weight:700}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{min-height:58px;border:1px solid #475569;background:#1e293b;color:white;border-radius:12px;font-size:24px;font-weight:900;cursor:pointer;touch-action:manipulation}.choice.good{background:#22c55e;border-color:#86efac}.choice.bad{background:#ef4444;border-color:#fca5a5}.center{flex:1;display:flex;align-items:center;justify-content:center;text-align:center}.center h2{font-size:40px;margin:8px}.big{padding:13px 28px;font-size:20px;margin-top:14px}.result{display:flex;justify-content:center;gap:50px;margin:20px}.result b{font-size:60px;color:#86efac}@media(max-width:760px){.title small{display:none}.title b{font-size:15px}.tabs button{padding:8px;font-size:11px}.app{padding:7px}.panel{margin-top:6px;padding:7px}.ask{font-size:18px}.angle{font-size:55px}.choice{min-height:44px;font-size:18px}.feedback{min-height:70px;padding:8px}.feedback strong{font-size:17px}.stat small{display:none}}@media(orientation:portrait){body{overflow:auto}.app{min-height:100vh;height:auto}.game{grid-template-columns:1fr}.circle{width:min(80vw,440px)} }
</style></head><body><div id="app"></div><script>
const A=[0,30,45,60,90,120,135,150,180], H={0:['0°は円の一番右！','まずは右端を基準にしよう。'],30:['30°は右上の低め！','0°から上へ30°進んだ位置。'],45:['45°は右上の中央！','0°と90°のちょうど真ん中。'],60:['60°は右上の高め！','90°まであと30°の位置。'],90:['90°は円の一番上！','真上が90°。'],120:['120° = 180° - 60°','60°と左右対称の位置！'],135:['135° = 180° - 45°','45°と左右対称の位置！'],150:['150° = 180° - 30°','30°と左右対称の位置！'],180:['180°は円の一番左！','0°のちょうど反対側。']};
let s={mode:'a2p',type:'a2p',target:choice(),answered:false,chosen:null,correct:false,streak:0,score:0,attempts:0,time:60,running:false,finished:false,timer:null,next:null};
function choice(prev){let p=A.filter(x=>x!==prev);return p[Math.floor(Math.random()*p.length)]}function esc(x){return String(x)}
function circle(position=false){let items=A.map(d=>{let r=d*Math.PI/180,x=210+155*Math.cos(r),y=210-155*Math.sin(r),good=s.answered&&d===s.target,bad=s.answered&&d===s.chosen&&s.chosen!==s.target,glow=position&&!s.answered&&d===s.target,fill=good?'#22c55e':bad?'#ef4444':glow?'#fbbf24':'#dbe6ff',stroke=good?'#bbf7d0':bad?'#fecaca':glow?'#fff1a8':'#172238';return `${glow?`<circle cx="${x}" cy="${y}" r="23" fill="#fbbf24" opacity=".2"/>`:''}<g ${!position&&!s.answered?`onclick="answer(${d})" style="cursor:pointer"`:''}><circle cx="${x}" cy="${y}" r="22" fill="transparent"/><circle cx="${x}" cy="${y}" r="9" fill="${fill}" stroke="${stroke}" stroke-width="3"/></g>`}).join('');return `<svg class="circle" viewBox="0 0 420 420"><circle cx="210" cy="210" r="155" fill="#101a2d" stroke="#7183a8" stroke-width="3"/><line x1="33" y1="210" x2="387" y2="210" stroke="#435270" stroke-width="2"/><line x1="210" y1="33" x2="210" y2="387" stroke="#435270" stroke-width="2"/>${items}</svg>`}
function feedback(){if(!s.answered)return '<div class="feedback"></div>';if(s.correct)return `<div class="feedback ok"><strong>正解！ ✓</strong>${s.streak>=5?`<div class="hint">${s.streak}連続！🔥</div>`:''}</div>`;return `<div class="feedback ng"><strong>おしい！ 正解は ${s.target}°</strong><div class="hint">${H[s.target][0]} ${H[s.target][1]}</div></div>`}
function game(){if(s.type==='a2p')return `<div class="game"><section class="side"><div class="kind">角度 → 位置</div><div class="ask">この角度はどこ？</div><div class="angle">${s.target}°</div>${feedback()}</section><section class="circleWrap">${circle(false)}</section></div>`;return `<div class="game"><section class="side" style="align-items:center"><div class="circleWrap">${circle(true)}</div><div class="ask" style="margin:0 0 4px">光っている位置は何度？</div></section><section class="side"><div class="kind" style="color:#c4b5fd;margin-bottom:10px">位置 → 角度</div><div class="choices">${A.map(a=>`<button ${s.answered?'disabled':''} onclick="answer(${a})" class="choice ${s.answered&&a===s.target?'good':''} ${s.answered&&a===s.chosen&&a!==s.target?'bad':''}">${a}°</button>`).join('')}</div>${feedback()}</section></div>`}
function stats(){let ac=s.attempts?Math.round(s.score/s.attempts*100):0;return `<div class="stats"><div class="stat"><small>正解数</small><b>${s.score}</b></div><div class="stat"><small>連続正解</small><b>${s.streak}</b></div><div class="stat"><small>正答率</small><b>${ac}%</b></div><div class="stat"><small>残り時間</small><b>${s.time}秒</b></div></div>`}
function render(){let content;if(s.mode==='challenge'&&!s.running&&!s.finished)content=`<div class="center"><div><h2>⏱ 60秒チャレンジ</h2><p>2つの形式が交互に出るぞ。反射で答えよう！</p><button class="big" onclick="start()">スタート</button></div></div>`;else if(s.mode==='challenge'&&s.finished){let ac=s.attempts?Math.round(s.score/s.attempts*100):0;content=`<div class="center"><div><h2>TIME UP!</h2><div class="result"><div><b>${s.score}</b><br>正解</div><div><b>${ac}%</b><br>正答率</div></div><button class="big" onclick="start()">↻ もう一回</button></div></div>`}else content=game();document.getElementById('app').innerHTML=`<div class="app"><header class="top"><div class="title"><b>🎯 UNIT CIRCLE TRAINER</b><small>角度と場所を、反射で答えろ。</small></div><nav class="tabs">${[['a2p','角度 → 位置'],['p2a','位置 → 角度'],['challenge','60秒チャレンジ']].map(x=>`<button class="${s.mode===x[0]?'on':''}" onclick="setMode('${x[0]}')">${x[1]}</button>`).join('')}</nav></header>${s.mode==='challenge'?stats():''}<main class="panel">${content}</main></div>`}
function reset(nt){s.target=choice(s.target);s.answered=false;s.chosen=null;s.correct=false;if(nt)s.type=nt;render()}function setMode(m){clearInterval(s.timer);clearTimeout(s.next);Object.assign(s,{mode:m,type:m==='p2a'?'p2a':'a2p',answered:false,chosen:null,correct:false,streak:0,score:0,attempts:0,time:60,running:false,finished:false});s.target=choice(s.target);render()}
function start(){clearInterval(s.timer);clearTimeout(s.next);Object.assign(s,{type:'a2p',answered:false,chosen:null,correct:false,streak:0,score:0,attempts:0,time:60,running:true,finished:false});s.target=choice(s.target);s.timer=setInterval(()=>{s.time--;if(s.time<=0){s.time=0;s.running=false;s.finished=true;clearInterval(s.timer);clearTimeout(s.next)}render()},1000);render()}
function answer(v){if(s.answered||(s.mode==='challenge'&&!s.running))return;let ok=v===s.target;s.chosen=v;s.correct=ok;s.answered=true;s.streak=ok?s.streak+1:0;if(s.mode==='challenge'){s.attempts++;if(ok)s.score++}render();let frozen=s.type;s.next=setTimeout(()=>{if(s.mode==='challenge'&&!s.running)return;reset(s.mode==='challenge'?(frozen==='a2p'?'p2a':'a2p'):null)},ok?600:1000)}
render();
</script></body></html>
